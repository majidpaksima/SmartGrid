application:
  polling_interval_seconds: 0.25
  dashboard_refresh_seconds: 1.0
  restart_delay_seconds: 2.0
  close_retry_count: 5
  order_retry_count: 3
  history_lookback_days: 7
  dry_run: false
  console_mode: rich
  log_level: INFO
  shutdown_mode: leave_open

mt5:
  terminal_path: null
  login: null
  server: null
  deviation_points: 20
  request_timeout_seconds: 10

